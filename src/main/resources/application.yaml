spring:
  application:
    name: blog-post

  # Servlet mode: enables HTTP server for REST API;
  # Spring Shell still runs on a background thread.
  main:
    web-application-type: servlet

  shell:
    interactive:
      enabled: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}

  # ── Datasource (H2 in-memory — swap to PostgreSQL for prod) ──────────────
  datasource:
    url: jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ── JPA / Hibernate ──────────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # auto-creates schema on start; swap to 'validate' + Flyway for prod
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── H2 Console (dev only) ─────────────────────────────────────────────────
  h2:
    console:
      enabled: true
      path: /h2-console

blog-post:
  output-dir: blog-posts
  word-count: 800
  review-word-count: 200
